<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登入</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-5">

    <h2>登入系統</h2>

    <form method="POST">

        <input
        type="text"
        name="username"
        class="form-control"
        placeholder="帳號">

        <br>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="密碼">

        <br>

        <button
        type="submit"
        class="btn btn-primary">
        登入
        </button>

    </form>

</body>
</html>
